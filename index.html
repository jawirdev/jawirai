<! html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JawirAI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind Configuration -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'] },
            colors: {
              primary: {
                50: '#fef2f2', 100: '#fee2e2', 200: '#fecaca', 300: '#fca5a5',
                400: '#f87171', 500: '#ef4444', 600: '#dc2626', 700: '#b91c1c',
                800: '#991b1b', 900: '#7f1d1d',
              }
            }
          }
        }
      }
    </script>
    <!-- React & Babel (Supaya kode React jalan langsung di browser) -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Marked.js untuk render format text Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
      /* Custom Scrollbar */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #d1d5db; }
      
      /* Markdown Styles */
      .prose p { margin-bottom: 0.5rem; }
      .prose ul { list-style-type: disc; margin-left: 1.5rem; }
      .prose ol { list-style-type: decimal; margin-left: 1.5rem; }
      .prose pre { background: #1f2937; color: #f3f4f6; padding: 0.8rem; border-radius: 0.5rem; overflow-x: auto; margin: 0.5rem 0; }
      .prose code { background: #f3f4f6; color: #dc2626; padding: 0.1rem 0.3rem; border-radius: 0.25rem; font-size: 0.9em; font-family: monospace; }
      .prose pre code { background: transparent; color: inherit; padding: 0; }
      .prose strong { font-weight: 600; color: #111827; }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-white text-gray-900 h-screen overflow-hidden">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        // --- KONFIGURASI DAN DATA MODEL ---
        
        const BASE_API_URL = "https://api-faa.my.id/faa";

        const AI_MODELS = [
          { id: 'gemini', name: 'Gemini AI', description: 'Chat generatif natural berbasis Gemini.', endpoint: '/gemini-ai', paramName: 'text' },
          { id: 'claude', name: 'Claude AI', description: 'Claude 3 Haiku, respon natural & cepat.', endpoint: '/claude-ai', paramName: 'text' },
          { id: 'deep-ai', name: 'Deep AI', description: 'DeepSeek dengan reasoning (thinking process).', endpoint: '/deep-ai', paramName: 'text' },
          { id: 'dolphin', name: 'Dolphin AI', description: 'AI berbasis Dolphin.', endpoint: '/dolphin-ai', paramName: 'text' },
          { id: 'epsilon', name: 'Epsilon AI', description: 'Pencarian paper ilmiah (Semantic Scholar).', endpoint: '/epsilon-ai', paramName: 'text' },
          { id: 'flux', name: 'Flux AI', description: 'Generate gambar dari prompt teks.', endpoint: '/fluxai', paramName: 'text' },
          { id: 'gita', name: 'Gita AI', description: 'Kebijaksanaan berbasis Bhagavad Gita.', endpoint: '/gita-ai', paramName: 'text' },
          { id: 'jeeves', name: 'Jeeves AI', description: 'Conversational AI Jeeves.', endpoint: '/jeeves-ai', paramName: 'prompt' },
          { id: 'powerbrain', name: 'PowerBrain AI', description: 'Pengetahuan umum & teknologi.', endpoint: '/powerbrain-ai', paramName: 'text' },
          { id: 'islam', name: 'Islam AI', description: 'Akidah, Fiqih, & Sejarah Islam.', endpoint: '/islam-ai', paramName: 'text' },
          { id: 'public', name: 'Public AI', description: 'Tanya jawab umum respon cepat.', endpoint: '/publicai', paramName: 'text' },
          { id: 'quillbot', name: 'Quillbot AI', description: 'Chat dengan pencarian web aktif.', endpoint: '/quillbot', paramName: 'text' },
          { id: 'venice', name: 'Venice AI', description: 'Uncensored, reasoning & web-enabled.', endpoint: '/venice-ai', paramName: 'text' },
          { id: 'webpilot', name: 'WebPilot AI', description: 'Live web browsing & search.', endpoint: '/webpilot', paramName: 'text' },
          { id: 'wormgpt', name: 'WormGPT', description: 'Chat berbasis teks WormGPT.', endpoint: '/wormgpt', paramName: 'text' },
          { id: 'suno', name: 'Suno AI Music', description: 'Buat lagu & lirik. Format: "Topik | Genre"', endpoint: '/suno-ai', paramName: 'q', requiresGenre: true },
          { id: 'sora-job', name: 'Sora Video (Create)', description: 'Buat job video sinematik.', endpoint: '/sora', paramName: 'prompt', isJob: true },
          { id: 'sora-res', name: 'Sora Result', description: 'Cek status job Sora (Input ID).', endpoint: '/sora/status', paramName: 'id', isResult: true },
          { id: 'veo-job', name: 'Veo 3 Video (Create)', description: 'Buat job video Veo 3.', endpoint: '/veo3', paramName: 'prompt', isJob: true },
          { id: 'veo-res', name: 'Veo 3 Result', description: 'Cek status job Veo 3 (Input ID).', endpoint: '/veo3/status', paramName: 'id', isResult: true }
        ];

        // --- ICON (Menggunakan SVG langsung agar tidak perlu install library) ---
        const Icons = {
            Menu: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="18" x2="20" y2="18"/></svg>,
            Plus: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
            MessageSquare: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>,
            Info: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>,
            ChevronDown: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg>,
            Send: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>,
            User: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            Bot: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg>,
            Loader2: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>,
            Zap: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>,
            Image: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>,
            Video: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>,
            Music: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>,
            Sparkles: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>,
            BookOpen: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>,
            Search: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        };

        // --- SERVICE API ---
        const fetchAIResponse = async (model, input) => {
          try {
            const url = new URL(`${BASE_API_URL}${model.endpoint}`);
            
            if (model.requiresGenre) {
              const parts = input.split('|');
              const q = parts[0].trim();
              const genre = parts.length > 1 ? parts[1].trim() : 'pop';
              url.searchParams.append('q', q);
              url.searchParams.append('genre', genre);
            } else {
              let payload = input;
              // Tambahkan persona 'wir' jika bukan model job/result
              if (!model.isResult && !model.isJob && !model.requiresGenre) {
                 payload = `${input} (Penting: Jawablah dengan santai dan panggil saya 'wir' di dalam kalimatmu)`;
              }
              url.searchParams.append(model.paramName, payload);
            }

            const response = await fetch(url.toString(), {
              method: 'GET',
              headers: { 'Accept': 'application/json' }
            });

            if (!response.ok) throw new Error(`API Error: ${response.status}`);
            const data = await response.json();

            // Handling format response yang mungkin beda-beda
            if (typeof data === 'string') return data;
            if (data.result) return typeof data.result === 'string' ? data.result : JSON.stringify(data.result);
            if (data.response) return typeof data.response === 'string' ? data.response : JSON.stringify(data.response);
            if (data.data) return JSON.stringify(data.data);
            if (data.status) return `Status: ${data.status} \nData: ${JSON.stringify(data.data || data)}`;

            return JSON.stringify(data, null, 2);
          } catch (error) {
            console.error("Error fetching AI response:", error);
            return `Waduh wir, ada error nih: ${error.message || 'Gagal terhubung ke server.'}`;
          }
        };

        // --- KOMPONEN REACT ---

        const Sidebar = ({ isOpen, toggleSidebar, onNewChat }) => {
          return (
            <React.Fragment>
              <div 
                className={`fixed inset-0 bg-black/50 z-20 transition-opacity md:hidden ${isOpen ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}
                onClick={toggleSidebar}
              />
              <aside 
                className={`fixed md:static inset-y-0 left-0 z-30 w-72 bg-gray-50 border-r border-red-100 transform transition-transform duration-300 ease-in-out md:transform-none ${isOpen ? 'translate-x-0' : '-translate-x-full'}`}
              >
                <div className="flex flex-col h-full">
                  <div className="p-4 flex items-center justify-between">
                    <h1 className="text-2xl font-bold text-primary-600 tracking-tighter flex items-center gap-2">
                      <span className="text-3xl">🇮🇩</span> JawirAI
                    </h1>
                    <button onClick={toggleSidebar} className="md:hidden p-2 text-gray-500 hover:bg-gray-200 rounded-full">
                      <Icons.Menu size={20} />
                    </button>
                  </div>

                  <div className="px-4 mb-4">
                    <button 
                      onClick={() => {
                        onNewChat();
                        if (window.innerWidth < 768) toggleSidebar();
                      }}
                      className="w-full flex items-center gap-3 bg-red-100 hover:bg-red-200 text-primary-900 px-4 py-3 rounded-xl transition-colors font-medium text-sm"
                    >
                      <Icons.Plus size={18} />
                      <span>Obrolan Baru Wir</span>
                    </button>
                  </div>

                  <div className="flex-1 overflow-y-auto px-2">
                    <div className="px-3 py-2 text-xs font-semibold text-gray-400 uppercase tracking-wider">
                      Baru-baru ini
                    </div>
                    {/* Dummy History */}
                    <div className="flex items-center gap-3 px-3 py-2 text-sm text-gray-700 hover:bg-gray-200 rounded-lg cursor-pointer truncate">
                      <Icons.MessageSquare size={16} className="text-gray-400 shrink-0" />
                      <span className="truncate">Apa kabar wir?</span>
                    </div>
                  </div>

                  <div className="p-4 border-t border-red-100">
                     <div className="flex items-center gap-2 text-xs text-gray-500">
                        <Icons.Info size={14} />
                        <span>Versi GitHub Web</span>
                     </div>
                     <div className="mt-2 text-[10px] text-gray-400">
                       Design inspired by Gemini. <br/>
                       Theme: Merah Putih.
                     </div>
                  </div>
                </div>
              </aside>
            </React.Fragment>
          );
        };

        const ModelSelector = ({ currentModel, onSelectModel }) => {
          const [isOpen, setIsOpen] = React.useState(false);
          const dropdownRef = React.useRef(null);

          React.useEffect(() => {
            const handleClickOutside = (event) => {
              if (dropdownRef.current && !dropdownRef.current.contains(event.target)) {
                setIsOpen(false);
              }
            };
            document.addEventListener('mousedown', handleClickOutside);
            return () => document.removeEventListener('mousedown', handleClickOutside);
          }, []);

          const getIcon = (id) => {
            if (id.includes('sora') || id.includes('veo')) return <Icons.Video size={16} className="text-purple-500" />;
            if (id.includes('flux')) return <Icons.Image size={16} className="text-green-500" />;
            if (id.includes('suno')) return <Icons.Music size={16} className="text-pink-500" />;
            if (id.includes('gemini') || id.includes('claude')) return <Icons.Sparkles size={16} className="text-blue-500" />;
            if (id.includes('gita') || id.includes('islam')) return <Icons.BookOpen size={16} className="text-yellow-600" />;
            if (id.includes('pilot') || id.includes('epsilon')) return <Icons.Search size={16} className="text-orange-500" />;
            return <Icons.Zap size={16} className="text-primary-600" />;
          };

          return (
            <div className="relative" ref={dropdownRef}>
              <button
                onClick={() => setIsOpen(!isOpen)}
                className="flex items-center gap-2 bg-gray-100 hover:bg-gray-200 text-gray-800 px-3 py-1.5 rounded-lg text-sm font-medium transition-colors border border-transparent hover:border-gray-300"
              >
                {getIcon(currentModel.id)}
                <span className="truncate max-w-[120px] md:max-w-none">{currentModel.name}</span>
                <Icons.ChevronDown size={14} className={`transition-transform ${isOpen ? 'rotate-180' : ''}`} />
              </button>

              {isOpen && (
                <div className="absolute bottom-full left-0 mb-2 w-72 max-h-96 overflow-y-auto bg-white rounded-xl shadow-xl border border-gray-200 z-50 animate-in fade-in zoom-in-95 duration-100">
                  <div className="p-2 sticky top-0 bg-white border-b border-gray-100 z-10">
                    <span className="text-xs font-semibold text-gray-500 uppercase px-2">Pilih Model Jawir</span>
                  </div>
                  <div className="p-2 space-y-1">
                    {AI_MODELS.map((model) => (
                      <button
                        key={model.id}
                        onClick={() => {
                          onSelectModel(model);
                          setIsOpen(false);
                        }}
                        className={`w-full text-left px-3 py-2.5 rounded-lg text-sm flex items-start gap-3 transition-colors ${
                          currentModel.id === model.id ? 'bg-red-50 text-primary-700' : 'hover:bg-gray-50 text-gray-700'
                        }`}
                      >
                        <div className="mt-0.5">{getIcon(model.id)}</div>
                        <div>
                          <div className="font-medium">{model.name}</div>
                          <div className="text-xs text-gray-500 leading-tight mt-0.5 line-clamp-2">
                            {model.description}
                          </div>
                        </div>
                      </button>
                    ))}
                  </div>
                </div>
              )}
            </div>
          );
        };

        const ChatArea = ({ messages, isLoading }) => {
          const scrollRef = React.useRef(null);

          React.useEffect(() => {
            if (scrollRef.current) {
              scrollRef.current.scrollIntoView({ behavior: 'smooth' });
            }
          }, [messages, isLoading]);

          const renderContent = (content) => {
             // Deteksi gambar sederhana
             if (content.match(/\.(jpeg|jpg|gif|png)$/) != null || (content.startsWith('http') && content.includes('image'))) {
                return <img src={content} alt="Generated" className="max-w-full rounded-lg shadow-md mt-2" loading="lazy" />;
             }
             
             // Render Markdown ke HTML
             const html = marked.parse(content);
             return <div className="prose prose-sm max-w-none prose-p:leading-relaxed" dangerouslySetInnerHTML={{ __html: html }} />;
          };

          return (
            <div className="flex-1 overflow-y-auto p-4 md:p-8 space-y-6">
              {messages.length === 0 ? (
                <div className="h-full flex flex-col items-center justify-center text-center text-gray-400 opacity-0 animate-[fadeIn_0.5s_ease-out_forwards]">
                    <div className="w-16 h-16 bg-gradient-to-br from-red-100 to-white rounded-2xl flex items-center justify-center mb-4 shadow-sm border border-red-50">
                        <span className="text-4xl">🇮🇩</span>
                    </div>
                  <h2 className="text-2xl font-semibold text-gray-800 mb-2">JawirAI Siap Membantu</h2>
                  <p className="max-w-md text-gray-500">
                    Pilih model AI, ketik pertanyaanmu, dan biarkan "wir" yang menjawabnya.
                  </p>
                </div>
              ) : (
                messages.map((msg) => (
                  <div
                    key={msg.id}
                    className={`flex w-full ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}
                  >
                    <div className={`flex max-w-[85%] md:max-w-[75%] gap-3 ${msg.role === 'user' ? 'flex-row-reverse' : 'flex-row'}`}>
                      <div 
                        className={`w-8 h-8 rounded-full flex items-center justify-center shrink-0 shadow-sm
                        ${msg.role === 'user' ? 'bg-primary-600 text-white' : 'bg-white border border-gray-200 text-primary-600'}`}
                      >
                        {msg.role === 'user' ? <Icons.User size={18} /> : <Icons.Bot size={18} />}
                      </div>

                      <div className="flex flex-col gap-1 min-w-0">
                        {msg.role === 'assistant' && msg.modelName && (
                          <span className="text-xs text-gray-400 ml-1">{msg.modelName}</span>
                        )}
                        <div
                          className={`px-4 py-3 rounded-2xl shadow-sm text-sm break-words
                          ${msg.role === 'user' 
                            ? 'bg-primary-600 text-white rounded-tr-sm' 
                            : 'bg-white border border-gray-100 text-gray-800 rounded-tl-sm'
                          }`}
                        >
                          {renderContent(msg.content)}
                        </div>
                        <div className={`text-[10px] text-gray-300 mt-1 ${msg.role === 'user' ? 'text-right mr-1' : 'text-left ml-1'}`}>
                            {new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                        </div>
                      </div>

                    </div>
                  </div>
                ))
              )}
              
              {isLoading && (
                <div className="flex justify-start w-full">
                   <div className="flex gap-3 max-w-[75%]">
                     <div className="w-8 h-8 rounded-full bg-white border border-gray-200 text-primary-600 flex items-center justify-center shrink-0 shadow-sm animate-pulse">
                        <Icons.Bot size={18} />
                     </div>
                     <div className="bg-white border border-gray-100 px-4 py-3 rounded-2xl rounded-tl-sm shadow-sm flex items-center gap-2">
                        <Icons.Loader2 size={16} className="animate-spin text-primary-500" />
                        <span className="text-sm text-gray-500">Sedang mengetik wir...</span>
                     </div>
                   </div>
                </div>
              )}
              <div ref={scrollRef} />
            </div>
          );
        };

        const App = () => {
          const [isSidebarOpen, setIsSidebarOpen] = React.useState(false);
          const [currentModel, setCurrentModel] = React.useState(AI_MODELS[0]);
          const [input, setInput] = React.useState('');
          const [isLoading, setIsLoading] = React.useState(false);
          const [messages, setMessages] = React.useState([]);

          const handleSend = async () => {
            if (!input.trim() || isLoading) return;

            const userMessage = {
              id: Date.now().toString(),
              role: 'user',
              content: input,
              timestamp: Date.now(),
            };

            setMessages((prev) => [...prev, userMessage]);
            setInput('');
            setIsLoading(true);

            const resultText = await fetchAIResponse(currentModel, userMessage.content);

            const botMessage = {
              id: (Date.now() + 1).toString(),
              role: 'assistant',
              content: resultText,
              timestamp: Date.now(),
              modelName: currentModel.name,
            };

            setMessages((prev) => [...prev, botMessage]);
            setIsLoading(false);
          };

          const handleKeyDown = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
              e.preventDefault();
              handleSend();
            }
          };

          const handleNewChat = () => {
            setMessages([]);
            setInput('');
          };

          return (
            <div className="flex h-screen bg-white">
              <Sidebar 
                isOpen={isSidebarOpen} 
                toggleSidebar={() => setIsSidebarOpen(!isSidebarOpen)} 
                onNewChat={handleNewChat}
              />

              <main className="flex-1 flex flex-col h-full relative w-full">
                <header className="md:hidden flex items-center justify-between p-4 border-b border-gray-100 bg-white z-10">
                   <button onClick={() => setIsSidebarOpen(true)} className="text-gray-600">
                     <Icons.Menu size={24} />
                   </button>
                   <span className="font-bold text-primary-600 text-lg">JawirAI</span>
                   <button onClick={handleNewChat} className="text-gray-600">
                     <Icons.Plus size={24} />
                   </button>
                </header>

                <ChatArea messages={messages} isLoading={isLoading} />

                <div className="p-4 bg-white">
                  <div className="max-w-4xl mx-auto">
                    <div className="bg-gray-100 rounded-3xl p-2 pl-4 flex flex-col gap-2 shadow-inner border border-transparent focus-within:border-gray-300 focus-within:bg-white transition-all">
                      
                      <textarea
                        value={input}
                        onChange={(e) => setInput(e.target.value)}
                        onKeyDown={handleKeyDown}
                        placeholder={
                          currentModel.requiresGenre 
                          ? "Masukkan: Topik Lagu | Genre (Contoh: Kopi Pagi | Jazz)" 
                          : currentModel.isResult 
                          ? "Masukkan ID Job..."
                          : `Tanya ${currentModel.name} sesuatu...`
                        }
                        className="w-full bg-transparent border-none focus:ring-0 resize-none max-h-32 min-h-[48px] py-3 text-gray-800 placeholder-gray-500 outline-none"
                        rows={1}
                      />

                      <div className="flex items-center justify-between pb-1 pr-1">
                        <ModelSelector currentModel={currentModel} onSelectModel={setCurrentModel} />
                        
                        <button
                          onClick={handleSend}
                          disabled={!input.trim() || isLoading}
                          className={`p-2.5 rounded-full transition-all ${
                            input.trim() && !isLoading 
                              ? 'bg-primary-600 text-white hover:bg-primary-700 shadow-md' 
                              : 'bg-gray-200 text-gray-400 cursor-not-allowed'
                          }`}
                        >
                          <Icons.Send size={18} />
                        </button>
                      </div>
                    </div>
                    <div className="text-center mt-2 text-xs text-gray-400">
                       JawirAI dapat membuat kesalahan. Periksa info penting wir.
                    </div>
                  </div>
                </div>
              </main>
            </div>
          );
        };

        // Render Aplikasi
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
